<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://*.trycloudflare.com https://api.github.com; img-src 'self' data: https://*.trycloudflare.com; base-uri 'none'; form-action 'none'">
<title>Mein Haus in Flexhausen</title>
<style>
:root{--bg:#0d0f14;--card:#171a22;--line:#2a2f3c;--text:#f3f1ea;--dim:#a4a8b5;--gold:#f5c542;--gold2:#ffe9a6;--ok:#57d38c;--warn:#ff8a5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:20px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px;letter-spacing:.5px;font-weight:900;color:var(--gold);text-transform:uppercase}
.sub{color:var(--dim);margin:0 0 18px}
form{display:flex;gap:8px;margin-bottom:8px}
.at{position:relative;flex:1;min-width:0}
.at span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);font-weight:700}
input{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);background:#10131a;color:var(--text);font:inherit;font-size:18px;padding:0 14px 0 34px;outline:none}
input:focus{border-color:var(--gold)}
button{height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--gold);color:#1b1503;font:inherit;font-weight:800;font-size:17px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.98)}
.hint{color:var(--dim);font-size:14px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who b{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.who small{display:block;color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.rank{flex:none;text-align:center;background:#10131a;border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.rank b{display:block;font-size:22px;color:var(--gold)}
.rank small{font-size:12px}
.pic{margin:14px -6px 6px;border-radius:14px;overflow:hidden;background:linear-gradient(#1c2a4a,#3f679c)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s{background:#10131a;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.s .p{height:132px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#1c2a4a,#3f679c);border-radius:10px;overflow:hidden}
.s img{display:block;max-width:100%;max-height:128px;width:auto;height:auto}
.s b{display:block;margin-top:6px;color:var(--gold);font-size:13px}
.s span{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.s small{display:block;color:var(--dim);font-size:12px}
.pic svg{display:block;width:100%;height:auto}
.pic img{display:block;margin:0 auto;padding:10px 0 0;max-width:100%;max-height:360px;width:auto;height:auto}
.lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
.lvl .n{font-size:15px;font-weight:800;color:#1b1503;background:var(--gold);border-radius:999px;padding:3px 12px}
.lvl .h{font-size:22px;font-weight:800}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.num{background:#10131a;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.num b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.num small{color:var(--dim);font-size:13px}
.bar{height:14px;border-radius:999px;background:#10131a;border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s}
.next{font-size:15px}
.next b{color:var(--gold2)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font-size:13px;border-radius:999px;padding:4px 10px;background:#10131a;border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:var(--ok);border-color:#285a3f}
.tag.warn{color:var(--warn);border-color:#6b3a28}
.live{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
.dot.off{background:var(--warn);animation:none}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.bar i{transition:none}}
.msg{color:var(--dim)}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sug button{height:auto;padding:10px 14px;text-align:left;background:#10131a;color:var(--text);border:1px solid var(--line);font-weight:600;font-size:16px;white-space:normal;overflow-wrap:anywhere}
.sug small{color:var(--dim);font-weight:400}
h2{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .p{flex:none;width:26px;color:var(--gold);font-weight:800;text-align:right}
li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .lv{flex:none;color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
footer{color:var(--dim);font-size:13px;text-align:center;margin-top:8px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:8px 14px;border-radius:14px;background:#e11d48;color:#fff;font-weight:800;font-size:17px;text-decoration:none;text-align:center;margin:0 0 16px}
.go i{flex:none;width:10px;height:10px;border-radius:50%;background:#fff;animation:p 1.2s infinite}
.go.off{background:#10131a;border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:15px}
.go.off i{display:none}
.share{width:100%;margin-top:14px;background:#10131a;color:var(--gold);border:2px solid var(--gold)}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 20px;border-radius:14px;background:var(--gold);color:#1b1503;font-weight:800;font-size:17px;text-decoration:none;white-space:nowrap}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,6,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:9}
.ov img{max-width:100%;max-height:60vh;border-radius:14px;border:1px solid var(--line)}
.ov .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov p{margin:0;color:var(--dim);font-size:14px;text-align:center}
.ov .x{background:#10131a;color:var(--text);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.go i{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Flexhausen</h1>
  <p class="sub">Dein Haus aus dem TikTok-LIVE von @flexhausen</p>
  <a id="go" class="go off" href="https://www.tiktok.com/@flexhausen" target="_blank" rel="noopener"><i></i><span id="goT">Zum TikTok von @flexhausen</span></a>
  <form id="f" autocomplete="off">
    <label class="at"><span>@</span><input id="q" name="name" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" placeholder="dein TikTok-Name" aria-label="Dein TikTok-Name"></label>
    <button type="submit">Zeigen</button>
  </form>
  <p class="hint">Gib deinen TikTok-Benutzernamen ein (der mit dem @) oder deinen Anzeigenamen.</p>

  <section id="out" class="card" hidden aria-live="polite"></section>

  <section class="card">
    <h2>Die besten Zehn</h2>
    <ol id="top"><li class="msg">lädt …</li></ol>
    <div class="live"><span id="dot" class="dot"></span><span id="tot">–</span></div>
  </section>
  <section class="card">
    <h2 id="stH">Alle Stufen</h2>
    <div id="st" class="st"><p class="msg">lädt …</p></div>
  </section>
  <footer>Zahlen und Haus direkt aus dem Spiel, alle zwei Sekunden neu.</footer>
</main>
<div id="ov" class="ov" hidden></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id) }
  var fmt = function (n) { return Math.round(n || 0).toLocaleString('de-DE') }

  var current = ''; var timer = 0; var busy = false; var lastImg = null; var lastSrc = ''

  /* the house as a drawing: it grows with the level (wider, higher, finer) */

    var kind = L <= 3 ? 0 : L <= 6 ? 1 : L <= 9 ? 2 : L <= 12 ? 3 : L <= 15 ? 4 : L === 16 ? 5 : L === 17 ? 6 : L === 18 ? 7 : L === 19 ? 8 : 9
    var c = kinds[kind]

    add('rect', { x: x, y: y, width: w, height: h, fill: c[0], stroke: kind === 5 ? c[1] : c[1], 'stroke-width': kind === 5 ? 3 : 2, rx: kind >= 3 ? 3 : 1 })

    if (kind <= 2) add('path', { d: 'M' + (x - 10) + ' ' + y + 'L160 ' + (y - 34 - L) + 'L' + (x + w + 10) + ' ' + y + 'Z', fill: c[2] })
    else if (kind === 6) add('path', { d: 'M' + x + ' ' + y + 'h12v-9h12v9h12v-9h12v9h12v-9h12v9h12v-9h12v9', fill: 'none', stroke: c[1], 'stroke-width': 6 })

    else if (kind === 9) { add('path', { d: 'M' + (x - 12) + ' ' + y + 'L160 ' + (y - 40) + 'L' + (x + w + 12) + ' ' + y + 'Z', fill: c[1] }); for (var k = 0; k < 6; k++) add('rect', { x: x + 8 + k * (w - 28) / 5, y: y + 4, width: 12, height: h - 4, fill: c[2] }) }

    if (kind <= 1) add('rect', { x: x + w - 26, y: y - 30, width: 12, height: 26, fill: c[1] })

    for (var f = 0; f < floors; f++) for (var i = 0; i < cols; i++) {

      var wx = x + 9 + i * ((w - 18 - 14) / Math.max(1, cols - 1)); var wy = y + f * fh + 5

    }

    if (L >= 13 && kind === 4) add('ellipse', { cx: x - 30, cy: g + 9, rx: 28, ry: 7, fill: '#49c6ff' })
    if (L >= 20) for (var s = 0; s < 3; s++) add('ellipse', { cx: 60 + s * 100, cy: g + 6 + (s % 2) * 6, rx: 46, ry: 10, fill: '#ffffff', opacity: '.75' })
    return svg
  }

  /* (18.11.2026 ~15:30, the streamer, after the question what the page could do for the people: "ja, macht beides")
     1. "Jetzt live": the page knows whether the stream runs – a big button leads straight into the LIVE (somebody who
        got a shared picture from a friend lands here and is one tap away from the stream); otherwise to the profile.
     2. "Haus teilen": the own house as a picture for a story or a chat (name, level, rank, the real house picture),
        drawn here in the browser; every shared picture carries the address of this page. */
  function live (on) {
    var a = $('go'); a.className = 'go' + (on ? '' : ' off')
    a.href = on ? 'https://www.tiktok.com/@flexhausen/live' : 'https://www.tiktok.com/@flexhausen'
    $('goT').textContent = on ? 'Jetzt live – zum Stream' : 'Der Stream ist gerade aus – zum Profil von @flexhausen'
  }
  var sImg = null; var sSrc = ''
  /* the house picture once more, this time allowed to be drawn into a picture of our own (it comes from the game's address) */
  function prep (src) {
    if (sSrc === src) return
    sSrc = src; sImg = null
    var im = new Image(); im.crossOrigin = 'anonymous'
    im.onload = function () { if (sSrc === src) sImg = im }
    im.src = src + '?teilen=1'
  }
  function rrect (g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath() }
  function picture (h, d, withHouse) {
    var W = 1080; var H = 1920; var F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d')
    var bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#131724'); bg.addColorStop(1, '#07080c'); g.fillStyle = bg; g.fillRect(0, 0, W, H)
    g.strokeStyle = '#f5c542'; g.lineWidth = 6; rrect(g, 36, 36, W - 72, H - 72, 52); g.stroke()
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'
    g.fillStyle = '#f5c542'; g.font = '900 128px ' + F; g.fillText('FLEXHAUSEN', W / 2, 250)
    g.fillStyle = '#a4a8b5'; g.font = '700 40px ' + F; g.fillText('MEIN HAUS IM TIKTOK-LIVE', W / 2, 322)
    /* the house on its sky */
    var px = 100; var py = 380; var pw = W - 200; var ph = 780
    var sky = g.createLinearGradient(0, py, 0, py + ph); sky.addColorStop(0, '#1c2a4a'); sky.addColorStop(1, '#3f679c'); g.fillStyle = sky; rrect(g, px, py, pw, ph, 40); g.fill()
    if (withHouse && sImg && sImg.naturalWidth) {
      var k = Math.min((pw - 50) / sImg.naturalWidth, (ph - 50) / sImg.naturalHeight); var iw = sImg.naturalWidth * k; var ih = sImg.naturalHeight * k

    }
    /* level, house, name */
    var lv = 'STUFE ' + h.level + (d.totals && d.totals.levels ? ' VON ' + d.totals.levels : '')
    g.font = '900 46px ' + F; var lw = g.measureText(lv).width + 70
    g.fillStyle = '#f5c542'; rrect(g, W / 2 - lw / 2, 1200, lw, 76, 38); g.fill(); g.fillStyle = '#1b1503'; g.fillText(lv, W / 2, 1255)
    g.fillStyle = '#ffe9a6'; g.font = '800 60px ' + F; g.fillText(h.house || '', W / 2, 1362)
    var fs = 92; g.fillStyle = '#f3f1ea'
    do { g.font = '900 ' + fs + 'px ' + F; fs -= 4 } while (g.measureText(h.name).width > 880 && fs > 36)
    g.fillText(h.name, W / 2, 1478)
    g.fillStyle = '#a4a8b5'; g.font = '600 38px ' + F; g.fillText('@' + h.id, W / 2, 1536)
    /* three numbers */
    var cells = [['#' + fmt(h.rank), 'von ' + fmt(d.totals.residents) + ' Häusern'], [fmt(h.likes), 'Likes'], [fmt(h.coins), 'Coins']]
    for (var i = 0; i < 3; i++) {
      var bx = 100 + i * 300; g.fillStyle = '#10131a'; rrect(g, bx, 1578, 280, 150, 24); g.fill(); g.strokeStyle = '#2a2f3c'; g.lineWidth = 2; g.stroke()
      var n = 58; g.fillStyle = i ? '#f3f1ea' : '#f5c542'; do { g.font = '900 ' + n + 'px ' + F; n -= 3 } while (g.measureText(cells[i][0]).width > 250 && n > 26)
      g.fillText(cells[i][0], bx + 140, 1650)
      g.fillStyle = '#a4a8b5'; g.font = '600 26px ' + F; g.fillText(cells[i][1], bx + 140, 1700)
    }

    g.fillStyle = '#a4a8b5'; g.font = '600 32px ' + F; g.fillText('LIVE auf TikTok: @flexhausen', W / 2, 1850)
    return c
  }
  function share (h, d) {
    var url = ''
    try { url = picture(h, d, true).toDataURL('image/jpeg', 0.9) } catch (e) { try { url = picture(h, d, false).toDataURL('image/jpeg', 0.9) } catch (e2) { return } }
    var link = location.origin + location.pathname + '?name=' + encodeURIComponent(h.id)
    var ov = $('ov'); ov.textContent = ''; ov.hidden = false
    var im = el('img'); im.alt = 'Dein Haus in Flexhausen als Bild'; im.src = url; ov.appendChild(im)
    var row = el('div', 'row'); var file = null
    try { var bin = atob(url.split(',')[1]); var arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); file = new File([arr], 'mein-haus-flexhausen.jpg', { type: 'image/jpeg' }) } catch (e3) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      var b1 = el('button', '', 'Teilen'); b1.type = 'button'
      b1.addEventListener('click', function () { navigator.share({ files: [file], text: 'Mein Haus in Flexhausen: ' + link }).catch(function () {}) }); row.appendChild(b1)
    }
    var a = el('a', 'btn', 'Bild speichern'); a.href = url; a.download = 'mein-haus-flexhausen.jpg'; row.appendChild(a)
    var b2 = el('button', 'x', 'Link kopieren'); b2.type = 'button'
    b2.addEventListener('click', function () { try { navigator.clipboard.writeText(link).then(function () { b2.textContent = 'Kopiert' }, function () { b2.textContent = link }) } catch (e4) { b2.textContent = link } }); row.appendChild(b2)
    var b3 = el('button', 'x', 'Schließen'); b3.type = 'button'; b3.addEventListener('click', function () { ov.hidden = true; ov.textContent = '' }); row.appendChild(b3)
    ov.appendChild(row)
    ov.appendChild(el('p', '', 'Tipp: Bild gedrückt halten, speichern und in deine Story oder deinen Chat packen.'))
  }

  function show (d) {
    var out = $('out'); out.hidden = false; out.textContent = ''
    if (typeof d.fresh === 'boolean') live(d.fresh)
    if (d.error) { out.appendChild(el('p', 'msg', d.error)); return }
    if (!d.found) {
      if (d.suggestions && d.suggestions.length) {
        out.appendChild(el('p', 'msg', 'Kein genauer Treffer. Meinst du:'))
        var box = el('div', 'sug')
        d.suggestions.forEach(function (s) { var b = el('button'); b.type = 'button'; b.appendChild(el('span', '', s.name + ' ')); b.appendChild(el('small', '', '@' + s.id + ' · Stufe ' + s.level)); b.addEventListener('click', function () { $('q').value = s.id; look(s.id, true) }); box.appendChild(b) })
        out.appendChild(box)
      } else out.appendChild(el('p', 'msg', 'Unter diesem Namen steht noch kein Haus in Flexhausen. Komm in den LIVE und lass ein Like da – dann hast du eins.'))

    }
    var h = d.house
    var who = el('div', 'who'); var left = el('div'); left.appendChild(el('b', '', h.name)); left.appendChild(el('small', '', '@' + h.id)); who.appendChild(left)
    var rank = el('div', 'rank'); rank.appendChild(el('b', '', '#' + fmt(h.rank))); rank.appendChild(el('small', '', 'von ' + fmt(d.totals.residents))); who.appendChild(rank)
    out.appendChild(who)
    var pic = el('div', 'pic')
    if (h.img) {
      /* the same picture stays the same element from reading to reading: nothing flickers */
      var src = BASE + h.img
      if (!lastImg || lastSrc !== src) { lastSrc = src; lastImg = el('img'); lastImg.alt = 'Haus der Stufe ' + h.level + ' – ' + h.house; lastImg.decoding = 'async'; lastImg.onerror = (function (lv, im) { return function () { if (im.parentNode) im.parentNode.replaceChild(drawing(lv), im); lastImg = null } })(h.level, lastImg); lastImg.src = src }
      pic.appendChild(lastImg)
    } else pic.appendChild(drawing(h.level))
    out.appendChild(pic)
    var lvl = el('div', 'lvl'); lvl.appendChild(el('span', 'n', 'Stufe ' + h.level + (d.totals && d.totals.levels ? ' von ' + d.totals.levels : ''))); lvl.appendChild(el('span', 'h', h.house)); out.appendChild(lvl)
    var nums = el('div', 'nums')
    var a = el('div', 'num'); a.appendChild(el('b', '', fmt(h.likes))); a.appendChild(el('small', '', 'Likes gegeben')); nums.appendChild(a)
    var b = el('div', 'num'); b.appendChild(el('b', '', fmt(h.coins))); b.appendChild(el('small', '', 'Coins geschickt')); nums.appendChild(b)
    out.appendChild(nums)
    if (h.next) {
      var bar = el('div', 'bar'); var fill = el('i'); bar.appendChild(fill); out.appendChild(bar)
      setTimeout(function () { fill.style.width = Math.round(h.next.part * 100) + '%' }, 30)
      var nx = el('div', 'next'); nx.appendChild(document.createTextNode('Noch ')); nx.appendChild(el('b', '', fmt(h.next.likes) + ' Likes')); nx.appendChild(document.createTextNode(' oder ')); nx.appendChild(el('b', '', fmt(h.next.coins) + ' Coins'))
      nx.appendChild(document.createTextNode(' bis Stufe ' + h.next.level + (h.next.name ? ' – ' + h.next.name : ''))); out.appendChild(nx)
    } else { var done = el('div', 'next'); done.appendChild(el('b', '', 'Höchste Stufe erreicht – dein Haus ist fertig.')); out.appendChild(done) }
    var tags = el('div', 'tags')
    tags.appendChild(el('span', 'tag ' + (h.onMap ? 'ok' : 'warn'), h.onMap ? 'steht in der Stadt' : 'gerade eingelagert – beim nächsten Like steht es wieder'))
    if (h.damaged) tags.appendChild(el('span', 'tag warn', 'beschädigt'))
    if (h.hotel) tags.appendChild(el('span', 'tag ok', 'Hotel Stufe ' + h.hotel.level + (h.hotel.name ? ' – ' + h.hotel.name : '')))
    if (h.followed) tags.appendChild(el('span', 'tag', 'Haustier vor der Tür'))
    if (h.vaultWins) tags.appendChild(el('span', 'tag', 'Tresor geknackt: ' + h.vaultWins + '×'))
    out.appendChild(tags)
    if (h.img) prep(BASE + h.img)
    var sb = el('button', 'share', 'Haus teilen'); sb.type = 'button'; sb.addEventListener('click', function () { share(h, d) }); out.appendChild(sb)
    var lv2 = el('div', 'live'); lv2.appendChild(el('span', 'dot' + (d.fresh ? '' : ' off'))); lv2.appendChild(el('span', '', d.fresh ? 'live – wird alle 2 Sekunden neu gelesen' : 'der Stream läuft gerade nicht – letzter Stand')); out.appendChild(lv2)
  }

  /* On the fixed address (GitHub Pages) the numbers come from the game's own address, which changes now and then:
     it stands in adresse.json next to this page. If the game does not answer there, the newest address is fetched
     once more – straight from GitHub, past every cache – and the question is asked again. */
  var BASE = ''
  var STATIC = /\.github\.io$/.test(location.hostname)
  function resolve (fresh) {
    /* owner.github.io/repo/ – or, for the site of an organization, owner.github.io/ with the repository owner.github.io */
    var owner = location.hostname.split('.')[0]; var repo = location.pathname.split('/').filter(Boolean)[0] || (owner + '.github.io')
    var pages = function () { return fetch('adresse.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json() }) }
    var api = function () { return fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/adresse.json', { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }).then(function (r) { return r.json() }) }
    return (fresh ? api() : pages()).catch(function () { return fresh ? pages() : api() }).then(function (j) {
      var a = String((j && j.api) || '').replace(/\/+$/, '')
      if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(a)) throw new Error('keine Adresse')
      BASE = a; return a
    })
  }
  function get (path) {
    var go = function () { return fetch(BASE + path, { cache: 'no-store' }).then(function (r) { if (!r.ok && r.status !== 429) throw new Error('weg'); return r.json() }) }
    if (!STATIC) return go()
    return (BASE ? Promise.resolve() : resolve(false)).then(go).catch(function () { return resolve(true).then(go) })
  }
  function look (name, first) {
    name = String(name || '').trim(); if (!name) return
    current = name; clearTimeout(timer)
    if (first) { var out = $('out'); out.hidden = false; out.textContent = ''; out.appendChild(el('p', 'msg', 'suche …')) ; try { localStorage.setItem('flexhausen-name', name) } catch (e) {} ; try { history.replaceState(null, '', '?name=' + encodeURIComponent(name)) } catch (e) {} }
    if (busy) return
    busy = true
    get('/api/haus?name=' + encodeURIComponent(name)).then(function (d) { if (name === current) { show(d); if (d.found) timer = setTimeout(function () { if (!document.hidden) look(current); else timer = setTimeout(function () { look(current) }, 4000) }, 2000) } })
      .catch(function () { if (first) show({ error: 'Gerade keine Verbindung zum Spiel. Versuch es gleich noch einmal.' }); else timer = setTimeout(function () { look(current) }, 8000) })
      .then(function () { busy = false })
  }
  function top () {
    get('/api/top').then(function (d) {
      var ol = $('top'); ol.textContent = ''
      if (!d.top || !d.top.length) ol.appendChild(el('li', 'msg', 'Noch niemand da.'))
      ;(d.top || []).forEach(function (h) { var li = el('li'); li.appendChild(el('span', 'p', h.rank + '.')); li.appendChild(el('span', 'nm', h.name)); li.appendChild(el('span', 'lv', 'Stufe ' + h.level + ' · ' + fmt(h.likes) + ' Likes')); ol.appendChild(li) })
      $('tot').textContent = fmt(d.totals.residents) + ' Häuser · ' + fmt(d.totals.likes) + ' Likes' + (d.fresh ? '' : ' · Stream läuft gerade nicht')
      $('dot').className = 'dot' + (d.fresh ? '' : ' off')
      live(!!d.fresh)
    }).catch(function () { $('dot').className = 'dot off' })
  }
  $('f').addEventListener('submit', function (e) { e.preventDefault(); look($('q').value, true); $('q').blur() })
  var start = ''
  try { start = new URLSearchParams(location.search).get('name') || localStorage.getItem('flexhausen-name') || '' } catch (e) {}
  if (start) { $('q').value = start.replace(/^@+/, ''); look(start, true) }
  function levels () {
    get('/api/stufen').then(function (d) {
      var box = $('st'); box.textContent = ''; $('stH').textContent = 'Alle ' + d.count + ' Stufen'
      ;(d.levels || []).forEach(function (s) {
        var c = el('div', 's'); var p = el('div', 'p')
        if (s.img) { var im = el('img'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = 'Stufe ' + s.level + ' – ' + s.name; im.src = BASE + s.img; p.appendChild(im) }
        c.appendChild(p); c.appendChild(el('b', '', 'Stufe ' + s.level)); c.appendChild(el('span', '', s.name))
        c.appendChild(el('small', '', s.level === 1 ? 'ab dem ersten Like' : 'ab ' + fmt(s.likes) + ' Likes oder ' + fmt(s.coins) + ' Coins'))
        box.appendChild(c)
      })
    }).catch(function () { setTimeout(levels, 6000) })
  }
  top(); levels(); setInterval(function () { if (!document.hidden) top() }, 10000)
})()
</script>
</body>
</html>
